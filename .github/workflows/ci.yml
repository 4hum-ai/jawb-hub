# The checker's own tests, on maintainer changes to tools/.
name: CI

on:
  pull_request:
    paths: ['tools/**', 'package.json', 'package-lock.json', '.github/**']
  push:
    branches: [main]

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    name: Checker tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: node --version && node --test tools/*.test.mjs
